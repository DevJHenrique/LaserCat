name: Scoped task
description: A well-defined unit of work that a contributor or an AI-assisted contributor can pick up.
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Scoped tasks are small enough to finish in one pull request. Fill every field so someone without prior context (human or agent) can complete and verify the work. See docs/AI_AGENTS.md.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The user-visible outcome or the invariant to protect.
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Owning module(s)
      description: e.g. planner, import, grbl, storage, ui/workspace. See ARCHITECTURE.md.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that make this done, including the regression test to add.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk area
      multiple: true
      options:
        - None of these
        - Machine execution / G-code
        - File format / compatibility
        - UI layout
        - New dependency
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Related work that should not be part of this change.
