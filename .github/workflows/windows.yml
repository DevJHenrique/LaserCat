name: LaserCat Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Debug checks and tests
        run: ./scripts/Test-Project.ps1
      - name: Release checks and tests
        run: ./scripts/Test-Project.ps1 -Profile release
      - name: Save test logs even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LaserCat-test-logs
          path: target/test-results/
          if-no-files-found: warn
  package:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/Build-Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LaserCat-windows-x64
          path: dist/
