[package]
name = "lasercat"
version = "0.2.2"
edition = "2021"
rust-version = "1.97"
description = "An offline visual workspace for GRBL laser cutting and engraving"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/DevJHenrique/LaserCat"
homepage = "https://github.com/DevJHenrique/LaserCat"
keywords = ["laser", "grbl", "cnc", "engraving", "gcode"]
categories = ["gui", "graphics", "hardware-support"]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
# Only to keep the symbol/emoji fallback fonts that eframe 0.37 no longer enables via `default_fonts`.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
resvg = "0.48.1"
rfd = "0.17.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serialport = "4.7"
tempfile = "3"
roxmltree = "0.21"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation"] }

[profile.release]
lto = "thin"
strip = true

